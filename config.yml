ui:
  # The Angular Node.js server listens on all interfaces inside the container;
  # nginx (or another reverse proxy) terminates TLS and forwards requests to port 4000.
  ssl: false
  host: 0.0.0.0
  port: 4000
  namespace: /

rest:
  # REST API reachable at the server's public IP on port 8080.
  # Both the Angular SSR process (Docker container) and browser clients use this URL.
  # TODO: switch to ssl: true / host: bulawayo-polytechnic-repository.dare.co.zw / port: 443
  # once nginx with a valid TLS certificate is deployed.
  ssl: false
  host: 144.91.125.128
  port: 8080
  namespace: /server

cache:
  msToLive:
    default: 900000

production: true

defaultLanguage: en

theme:
  name: dspace

mediaViewer:
  image: false
  video: false

info:
  enableEndUserAgreement: true
  enablePrivacyStatement: true

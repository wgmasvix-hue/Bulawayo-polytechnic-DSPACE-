ui:
  # The Angular Node.js server listens on all interfaces inside the container;
  # nginx (or another reverse proxy) terminates TLS and forwards requests to port 4000.
  ssl: false
  host: 0.0.0.0
  port: 4000
  namespace: /

rest:
  # The domain is used as the REST host for both SSR and browser clients.
  # Inside Docker, it resolves to the dspace container via a network alias.
  # Browser clients reach it on port 8080 via public DNS.
  # TODO: set ssl: true and port: 443 once nginx + TLS is running.
  ssl: false
  host: bulawayo-polytechnic-repository.dare.co.zw
  port: 8080
  namespace: /server

cache:
  msToLive:
    default: 900000

production: true

defaultLanguage: en

theme:
  name: dspace

mediaViewer:
  image: false
  video: false

info:
  enableEndUserAgreement: true
  enablePrivacyStatement: true

# Nginx reverse-proxy configuration for Bulawayo Polytechnic DSpace 8.1
#
# Responsibilities:
#   - TLS termination (HTTPS on 443, redirect HTTP→HTTPS on 80)
#   - Forward /server/* to the DSpace REST API backend (port 8080)
#   - Forward everything else to the DSpace Angular UI (port 4000)
#   - Inject X-Forwarded-* headers so DSpace logs real client IPs
#   - Add security headers
#
# Prerequisites:
#   - Place TLS certificate and private key at the paths below, OR use
#     Certbot / Let's Encrypt and update the ssl_certificate paths.
#   - Restart nginx after certificate renewal.

# Redirect all plain-HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bulawayo-polytechnic-repository.dare.co.zw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bulawayo-polytechnic-repository.dare.co.zw;

    # --- TLS certificates ---
    # If using Let's Encrypt / Certbot, typical paths are:
    #   /etc/letsencrypt/live/<domain>/fullchain.pem
    #   /etc/letsencrypt/live/<domain>/privkey.pem
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- TLS hardening (Mozilla Intermediate profile) ---
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;

    # Allow large file uploads (matches DSpace's spring.servlet.multipart.max-file-size).
    client_max_body_size 512m;

    # --- DSpace REST API backend ---
    # Matches /server and everything under it.
    location /server {
        proxy_pass         http://dspace:8080/server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Required for chunked / streaming responses from Spring Boot.
        proxy_buffering    off;
    }

    # --- DSpace Angular UI ---
    location / {
        proxy_pass         http://dspace-angular:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        # Support WebSocket upgrades used by Angular dev server (not needed in prod,
        # but harmless and avoids 400 errors if a browser tries).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

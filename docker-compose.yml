networks:
  dspacenet:
    ipam:
      config:
        # Custom subnet so the REST API can trust X-Forwarded-For from this range.
        # If you change this value also update proxies.trusted.ipranges in local.cfg.
        - subnet: 172.23.0.0/16
services:
  # DSpace (backend) webapp container
  dspace:
    container_name: dspace
    # Use the production Dockerfile (not Dockerfile.test which enables JDWP remote debugging).
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_OWNER:-dspace}/dspace:${DSPACE_VER:-dspace-8.1}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - dspacedb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/server/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      dspacenet:
        aliases:
          # Docker's embedded DNS returns the dspace container IP for this hostname
          # when queried from within the dspacenet network (e.g. from dspace-angular
          # during SSR).  Public DNS still resolves it to the server's external IP
          # for browser clients — so a single REST URL works for both.
          - bulawayo-polytechnic-repository.dare.co.zw
    # Port 8080 is exposed on all interfaces so browser-side Angular JS can reach the
    # REST API at http://144.91.125.128:8080/server.
    # TODO: once nginx + TLS is running, bind this back to 127.0.0.1 and let nginx
    # proxy /server internally — that removes the public 8080 exposure.
    ports:
      - "0.0.0.0:8080:8080"
      # Port 8000 is the Handle Server — only needed if a real Handle prefix is registered.
      - "127.0.0.1:8000:8000"
    environment:
      # __P__ => "." and __D__ => "-" in property names.
      # See https://github.com/DSpace/DSpace/blob/main/dspace/config/config-definition.xml
      dspace__P__dir: /dspace
      # Production URLs — must match the public hostname served by nginx/reverse-proxy.
      dspace__P__server__P__url: http://144.91.125.128:8080/server
      dspace__P__ui__P__url: http://144.91.125.128:4000
      dspace__P__name: 'Bulawayo Polytechnic DSpace'
      db__P__url: 'jdbc:postgresql://dspacedb:5432/dspace'
      db__P__password: '${POSTGRES_PASSWORD}'
      solr__P__server: http://dspacesolr:8983/solr
      # Trust X-Forwarded-For from the dspacenet subnet (nginx reverse proxy).
      proxies__P__trusted__P__ipranges: '172.23.0'
      LOGGING_CONFIG: /dspace/config/log4j2-container.xml
    stdin_open: true
    tty: true
    volumes:
      # Persist uploaded files (bitstreams) across container restarts.
      - assetstore:/dspace/assetstore
      # Mount local config directory so edits take effect without a rebuild.
      - ./dspace/config:/dspace/config
    # Wait for PostgreSQL to be ready, migrate schema, then start DSpace.
    entrypoint:
      - /bin/bash
      - '-c'
      - |
        while (!</dev/tcp/dspacedb/5432) > /dev/null 2>&1; do sleep 1; done;
        /dspace/bin/dspace database migrate
        java -jar /dspace/webapps/server-boot.jar --dspace.dir=/dspace

  # DSpace PostgreSQL database container
  dspacedb:
    container_name: dspacedb
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_OWNER:-dspace}/dspace-postgres-pgcrypto:${DSPACE_VER:-dspace-8.1}"
    build:
      context: ./dspace/src/main/docker/dspace-postgres-pgcrypto/
    restart: unless-stopped
    environment:
      PGDATA: /pgdata
      # Use the POSTGRES_PASSWORD variable from .env — never hard-code credentials here.
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    networks:
      dspacenet:
    # Do NOT expose PostgreSQL publicly. Access is only needed within the dspacenet network.
    # If you need local DBA access use: docker exec -it dspacedb psql -U dspace
    stdin_open: true
    tty: true
    volumes:
      - pgdata:/pgdata

  # DSpace Solr container
  dspacesolr:
    container_name: dspacesolr
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_OWNER:-dspace}/dspace-solr:${DSPACE_VER:-dspace-8.1}"
    build:
      context: ./dspace/src/main/docker/dspace-solr/
      additional_contexts:
        solrconfigs: ./dspace/solr/
      args:
        SOLR_VERSION: "${SOLR_VER:-8.11}"
    restart: unless-stopped
    networks:
      dspacenet:
    # Solr has no built-in authentication in this version — do NOT expose it publicly.
    # Bind to loopback only for local diagnostics if needed.
    # Uncomment the line below only for temporary local debugging:
    # ports:
    #   - "127.0.0.1:8983:8983"
    stdin_open: true
    tty: true
    working_dir: /var/solr/data
    volumes:
      - solr_data:/var/solr/data
    entrypoint:
      - /bin/bash
      - '-c'
      - |
        init-var-solr
        precreate-core authority /opt/solr/server/solr/configsets/authority
        cp -r /opt/solr/server/solr/configsets/authority/* authority
        precreate-core oai /opt/solr/server/solr/configsets/oai
        cp -r /opt/solr/server/solr/configsets/oai/* oai
        precreate-core search /opt/solr/server/solr/configsets/search
        cp -r /opt/solr/server/solr/configsets/search/* search
        precreate-core statistics /opt/solr/server/solr/configsets/statistics
        cp -r /opt/solr/server/solr/configsets/statistics/* statistics
        precreate-core qaevent /opt/solr/server/solr/configsets/qaevent
        cp -r /opt/solr/server/solr/configsets/qaevent/* qaevent
        precreate-core suggestion /opt/solr/server/solr/configsets/suggestion
        cp -r /opt/solr/server/solr/configsets/suggestion/* suggestion
        exec solr -f

volumes:
  assetstore:
  pgdata:
  solr_data:

services:
  dspace-angular:
    image: dspace/dspace-angular:dspace-8.1-dist
    container_name: dspace-angular
    restart: unless-stopped

    environment:
      # UI server (Node.js) listens on all interfaces inside the container.
      # nginx terminates TLS externally and proxies to port 4000.
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: "0.0.0.0"
      DSPACE_UI_PORT: "4000"
      DSPACE_UI_NAMESPACE: "/"

      # REST API endpoint.
      # Using the server's public IP (not the Docker-internal 'dspace' hostname)
      # means BOTH the Angular SSR Node.js process (inside the container) AND
      # browser-side JavaScript can reach the DSpace backend on port 8080.
      # TODO: once nginx + TLS is set up, change these to:
      #   DSPACE_REST_SSL: "true"
      #   DSPACE_REST_HOST: "bulawayo-polytechnic-repository.dare.co.zw"
      #   DSPACE_REST_PORT: "443"
      #   and bind port 8080 to 127.0.0.1 in docker-compose.yml.
      DSPACE_REST_SSL: "false"
      DSPACE_REST_HOST: "144.91.125.128"
      DSPACE_REST_PORT: "8080"
      DSPACE_REST_NAMESPACE: "/server"

    volumes:
      - ./config.yml:/app/config/config.yml:ro

    # Expose Angular on all interfaces so it is reachable at both:
    #   http://144.91.125.128:4000  (direct IP access)
    #   https://bulawayo-polytechnic-repository.dare.co.zw  (via nginx)
    ports:
      - "0.0.0.0:4000:4000"

    depends_on:
      - dspace

    networks:
      - dspacenet

networks:
  dspacenet:
    external: true
    name: bulawayo-polytechnic-dspace-official_dspacenet

#------------------------------------------------------------------#
#------------- LOCAL CONFIGURATION OVERRIDES (local.cfg) ----------#
#------------------------------------------------------------------#
# Bulawayo Polytechnic Institutional Repository — Production
#
# This file overrides dspace.cfg and all module configs.
# Keep secrets (passwords, API keys) here rather than in dspace.cfg.
# Never commit passwords or credentials to version control —
# use environment variables referenced as ${ENV_VAR} where possible.
#------------------------------------------------------------------#

##########  Site identity  #########################################
dspace.name      = Bulawayo Polytechnic Institutional Repository
dspace.shortname = BPoly-IR

# Public HTTPS URLs — must match the nginx/reverse-proxy frontend.
# DO NOT end with '/'.
dspace.server.url     = https://bulawayo-polytechnic-repository.dare.co.zw/server
dspace.server.ssr.url = ${dspace.server.url}
dspace.ui.url         = https://bulawayo-polytechnic-repository.dare.co.zw

##########  Database  ##############################################
# Docker Compose service name 'dspacedb' is used rather than localhost.
db.url      = jdbc:postgresql://dspacedb:5432/dspace
db.username = dspace
# Set POSTGRES_PASSWORD as an environment variable; do not hard-code it here.
db.password = ${POSTGRES_PASSWORD}

# Prevent accidental full database wipe in production.
# WARNING: Never set to 'false' in a live environment.
db.cleanDisabled = true

##########  Solr  ##################################################
# Docker Compose service name 'dspacesolr'.
solr.server = http://dspacesolr:8983/solr

##########  Email / SMTP  ##########################################
# TODO: Replace with your actual SMTP relay details.
mail.server      = smtp.dare.co.zw
mail.server.port = 587
# Uncomment and populate when SMTP auth is required:
#mail.server.username = <smtp-username>
#mail.server.password = <smtp-password>
#mail.extraproperties = mail.smtp.auth=true, mail.smtp.starttls.enable=true

mail.from.address = noreply@bulawayo-polytechnic-repository.dare.co.zw
feedback.recipient = repository@bpoly.ac.zw
mail.admin         = repository@bpoly.ac.zw
mail.admin.name    = Bulawayo Polytechnic Repository Administrator
mail.helpdesk      = repository@bpoly.ac.zw
mail.helpdesk.name = Bulawayo Polytechnic Repository Help Desk
alert.recipient    = repository@bpoly.ac.zw

##########  Handle server  #########################################
# TODO: Register a real prefix at https://www.handle.net/ and
# replace 123456789 before going live.  All item identifiers minted
# with the test prefix will need to be updated after the change.
handle.prefix = 123456789

##########  DOI / DataCite  ########################################
# 10.5072 is the DataCite SANDBOX/TEST prefix — items minted with it
# are not resolvable via doi.org.  Obtain a production prefix and
# credentials from DataCite (or a DataCite member) before enabling DOI minting.
# TODO: Uncomment and populate the three lines below.
#identifier.doi.prefix   = 10.XXXXX
#identifier.doi.user     = <datacite-username>
#identifier.doi.password = <datacite-password>

##########  Branding  ##############################################
webui.preview.brand        = Bulawayo Polytechnic
webui.preview.brand.abbrev = BPoly

##########  DataCite crosswalk  ####################################
crosswalk.dissemination.DataCite.publisher = Bulawayo Polytechnic

##########  Proxy / trusted IP ranges  ############################
# Trust X-Forwarded-For headers forwarded by the nginx reverse proxy.
# The value must match the Docker subnet in docker-compose.yml (172.23.0.0/16).
proxies.trusted.ipranges = 172.23.0

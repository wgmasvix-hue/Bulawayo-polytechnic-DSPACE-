# Optional nginx reverse-proxy service for DSpace production deployments.
#
# Usage (after the main stack is already up):
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose-angular-prod.yml \
#                  -f docker-compose-nginx.yml up -d
#
# TLS certificate setup (Let's Encrypt example):
#   1. Install Certbot on the host: https://certbot.eff.org/
#   2. Run: certbot certonly --standalone -d bulawayo-polytechnic-repository.dare.co.zw
#   3. Certificates are written to /etc/letsencrypt/live/<domain>/
#   4. The volume mounts below make them available inside the nginx container.
#   5. Set up a Certbot renewal cron/systemd timer and reload nginx after renewal:
#        certbot renew --deploy-hook "docker exec dspace-nginx nginx -s reload"
#
# If you manage certificates differently, update the volume paths below.

services:
  dspace-nginx:
    image: nginx:1.27-alpine
    container_name: dspace-nginx
    restart: unless-stopped
    ports:
      # Expose HTTP (redirect to HTTPS) and HTTPS on all interfaces.
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      # Main site config (generated from nginx.conf in this repository).
      - ./nginx.conf:/etc/nginx/conf.d/dspace.conf:ro
      # TLS certificates from Let's Encrypt (adjust paths if using another CA).
      - /etc/letsencrypt/live/bulawayo-polytechnic-repository.dare.co.zw/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/bulawayo-polytechnic-repository.dare.co.zw/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - dspace
      - dspace-angular
    networks:
      - dspacenet

networks:
  dspacenet:
    external: true
    name: bulawayo-polytechnic-dspace-official_dspacenet
